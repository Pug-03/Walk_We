<!doctype html><html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'IBM Plex Sans Thai',sans-serif;background:#0B1F3A;color:#F1F6FD}
.top{position:absolute;top:16px;left:20px;right:16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:#7CC4F5;margin-right:auto}
.lang,.sos{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.lang{border:2px solid #7CC4F5;color:#7CC4F5;font-size:15px}
.sos{background:#B4232A;color:#fff;font-size:13px}
h1{position:absolute;top:96px;left:24px;right:24px;font-size:32px;line-height:1.3;color:#7CC4F5}
h1 em{font-style:normal;color:#F1F6FD}
.steps{position:absolute;top:220px;left:24px;right:24px;display:grid;gap:14px}
.st{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:14px;border-radius:20px;background:#12294A}
.n{font-size:40px;font-weight:700;color:#F5A524;line-height:1;text-align:center}
.st b{font-size:18px}
.st p{font-size:14px;color:#B8C7DC;line-height:1.5}
.mini{grid-column:2;height:34px;border-radius:10px;background:#1A3560;position:relative}
.cta{position:absolute;left:24px;right:24px;bottom:58px;height:62px;border-radius:22px;background:#7CC4F5;color:#0B1F3A;display:grid;place-items:center;font-size:19px;font-weight:700}
.foot{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:13px;color:#B8C7DC}
</style></head><body>
<div class="top"><span class="brand"><svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="#1E4FA8"/><path d="M7 11 L12 24 L17 14" fill="none" stroke="#7CC4F5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 14 L22 24 L27 11" fill="none" stroke="#F5A524" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="3.5 3"/></svg>Walk We</span><span class="lang">文A</span><span class="sos">SOS</span></div>
<h1>เดินร่มกว่า<br><em>กลับบ้านปลอดภัยกว่า</em></h1>
<div class="steps">
<div class="st"><span class="n">1</span><div><b>เลือกจุด</b><p>ตำแหน่งปัจจุบัน ค้นหา หรือปักหมุด</p></div></div>
<div class="st"><span class="n">2</span><div><b>เทียบร่มหรือความปลอดภัย</b><p>กลางวันดูเงาตึกจริง กลางคืนดูไฟ กล้อง คน (ตามข้อมูลที่มี)</p></div>
<svg class="mini" viewBox="0 0 230 34"><path d="M10 17 H120" stroke="#7CC4F5" stroke-width="6" stroke-linecap="round"/><path d="M120 17 H220" stroke="#F5A524" stroke-width="6" stroke-dasharray="9 7"/></svg></div>
<div class="st"><span class="n">3</span><div><b>เดินตามรูปทีละขั้น</b><p>มีปุ่ม SOS ทุกหน้า ใช้ได้แม้ไม่มีเน็ต</p></div></div>
</div>
<div class="cta">เริ่มเลย</div><p class="foot">ไม่ต้องสมัคร · ทดลองที่ สยาม – ราชประสงค์</p>
</body></html>
