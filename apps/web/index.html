<!doctype html>
<html lang="th" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch zoom and 200% text scaling must keep working. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050B1A" />
    <title>Walk We — เดินร่มกว่า กลับบ้านปลอดภัยกว่า (ตามข้อมูลที่มี)</title>
    <meta name="description" content="Walk We แนะนำเส้นทางเดินในกรุงเทพฯ กลางวันเลือกทางที่ร่มกว่า กลางคืนเลือกทางที่ปลอดภัยกว่า (ตามข้อมูลที่มี)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Walk We" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <script>
      // Paint the right theme before React boots, so night users never get a
      // bright flash. Mirrors store/theme.tsx (preference, else 06:00–18:00
      // Bangkok time as a first guess; the app refines it with sun times).
      (function () {
        try {
          var p = localStorage.getItem('ww_theme');
          var h = (new Date().getUTCHours() + 7) % 24;
          var t = p === 'day' || p === 'night' ? p : h >= 6 && h < 18 ? 'day' : 'night';
          document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('ww_lang');
          if (l === 'en') document.documentElement.lang = 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
