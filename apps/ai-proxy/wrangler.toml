# Walk We AI proxy. Deploy: npx wrangler secret put ANTHROPIC_API_KEY, then npm run deploy.
name = "walkwe-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Exact origin of the deployed web app; anything else gets 403. For local
# development put ALLOWED_ORIGINS="http://localhost:5173" in .dev.vars (git-ignored).
ALLOWED_ORIGINS = "https://walkwe-web.walkwe.workers.dev"

# 20 requests per minute per client address (all paths together)…
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

# …and 120 per minute for the whole service, whoever is calling.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "2002"
simple = { limit = 120, period = 60 }

# Request bodies and prompts are never logged; keep observability to metrics.
[observability]
enabled = false
