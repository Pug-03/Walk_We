<!doctype html><html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'IBM Plex Sans Thai',sans-serif;background:#EEF6FF;color:#0B1F3A}
.top{position:absolute;top:16px;left:20px;right:16px;display:flex;align-items:center;gap:8px;z-index:3}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:#1E4FA8;margin-right:auto}
.lang,.sos{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.lang{border:2px solid #1E4FA8;color:#1E4FA8;background:#fff;font-size:15px}
.sos{background:#B4232A;color:#fff;font-size:13px;box-shadow:0 0 0 5px rgba(229,72,77,.25)}
.scene{position:absolute;top:0;left:0;width:390px;height:470px}
.copy{position:absolute;top:470px;left:24px;right:24px}
h1{font-size:34px;line-height:1.3;color:#1E4FA8;font-weight:700}
h1 em{font-style:normal;color:#0B1F3A}
.sub{margin-top:10px;font-size:16px;line-height:1.6;color:#3A4D68}
.legend{margin-top:14px;display:flex;gap:16px;font-size:14px;color:#3A4D68;align-items:center}
.l1{display:inline-block;width:26px;border-top:5px solid #1E4FA8;border-radius:3px;margin-right:6px;vertical-align:middle}
.l2{display:inline-block;width:26px;border-top:5px dashed #F5A524;margin-right:6px;vertical-align:middle}
.cta{position:absolute;left:24px;right:24px;bottom:56px;height:60px;border-radius:22px;background:#1E4FA8;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;box-shadow:0 14px 28px -12px rgba(30,79,168,.6)}
.foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;color:#3A4D68}
</style></head><body>
<svg class="scene" viewBox="0 0 390 470">
 <rect width="390" height="470" fill="#EEF6FF"/>
 <circle cx="300" cy="110" r="34" fill="#F5A524"/>
 <path d="M40 150 Q200 40 360 150" fill="none" stroke="#F5A524" stroke-width="2" stroke-dasharray="3 7" opacity=".7"/>
 <!-- buildings -->
 <rect x="18" y="170" width="78" height="230" rx="6" fill="#1E4FA8"/>
 <rect x="104" y="220" width="64" height="180" rx="6" fill="#2A5FC0"/>
 <rect x="250" y="250" width="56" height="150" rx="6" fill="#2A5FC0"/>
 <rect x="312" y="200" width="66" height="200" rx="6" fill="#1E4FA8"/>
 <!-- BTS deck -->
 <rect x="0" y="300" width="390" height="16" fill="#0B1F3A"/>
 <rect x="150" y="316" width="10" height="84" fill="#0B1F3A"/><rect x="290" y="316" width="10" height="84" fill="#0B1F3A"/>
 <!-- shadows on sidewalk -->
 <polygon points="18,400 96,400 20,440 0,440" fill="#0B1F3A" opacity=".18"/>
 <polygon points="0,400 390,400 390,425 0,425" fill="#0B1F3A" opacity=".10"/>
 <!-- sidewalk -->
 <rect x="0" y="400" width="390" height="70" fill="#E3EEFC"/>
 <path d="M24 436 H210" stroke="#1E4FA8" stroke-width="7" stroke-linecap="round"/>
 <path d="M210 436 H366" stroke="#F5A524" stroke-width="7" stroke-dasharray="12 9"/>
 <circle cx="150" cy="436" r="11" fill="#fff" stroke="#1E4FA8" stroke-width="5"/>
 <text x="24" y="462" font-size="12" fill="#3A4D68" font-family="IBM Plex Sans Thai">ใต้ราง BTS · ร่ม</text>
 <text x="270" y="462" font-size="12" fill="#3A4D68" font-family="IBM Plex Sans Thai">โดนแดด 14:30</text>
</svg>
<div class="top"><span class="brand"><svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="#0B1F3A"/><path d="M7 11 L12 24 L17 14" fill="none" stroke="#7CC4F5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 14 L22 24 L27 11" fill="none" stroke="#F5A524" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="3.5 3"/></svg>Walk We</span><span class="lang">文A</span><span class="sos">SOS</span></div>
<div class="copy"><h1>เดินร่มกว่า<br><em>กลับบ้านปลอดภัยกว่า</em></h1><p class="sub">คำนวณเงาตึกตามเวลาที่คุณเดินจริง กลางคืนเลือกทางที่สว่างและมีคน (ตามข้อมูลที่มี)</p>
<p class="legend"><span><i class="l1"></i>ร่ม</span><span><i class="l2"></i>แดด</span></p></div>
<div class="cta">เริ่มเลย</div><p class="foot">ไม่ต้องสมัคร · ทดลองที่ สยาม – ราชประสงค์</p>
</body></html>
