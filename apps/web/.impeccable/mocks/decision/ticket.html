<!doctype html><html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'IBM Plex Sans Thai',sans-serif;background:#1E4FA8;color:#0B1F3A}
.top{position:absolute;top:16px;left:20px;right:16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:#fff;margin-right:auto}
.lang,.sos{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.lang{border:2px solid #7CC4F5;color:#fff;font-size:15px}
.sos{background:#B4232A;color:#fff;font-size:13px}
.ticket{position:absolute;top:92px;left:20px;right:20px;height:520px;background:#EEF6FF;border-radius:26px;padding:22px}
.kick{font-size:13px;font-weight:600;color:#1E4FA8;letter-spacing:.04em}
.route{margin-top:8px;font-size:30px;font-weight:700;line-height:1.25}
.route span{color:#1E4FA8}
.strip{margin:18px 0;height:90px;border-radius:16px;background:#fff;position:relative}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.stats b{display:block;font-size:26px;color:#1E4FA8}
.stats small{font-size:13px;color:#3A4D68}
.vs{margin-top:12px;font-size:14px;color:#3A4D68;text-align:center}
.perf{position:absolute;left:0;right:0;top:400px;border-top:3px dashed #9BB6DA}
.perf:before,.perf:after{content:'';position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:#1E4FA8}
.perf:before{left:-13px}.perf:after{right:-13px}
.stub{position:absolute;left:22px;right:22px;top:420px}
.stub h1{font-size:22px;line-height:1.35}
.cta{position:absolute;left:20px;right:20px;bottom:60px;height:62px;border-radius:22px;background:#7CC4F5;color:#0B1F3A;display:grid;place-items:center;font-size:19px;font-weight:700}
.foot{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:13px;color:#DCE8F8}
</style></head><body>
<div class="top"><span class="brand"><svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="#0B1F3A"/><path d="M7 11 L12 24 L17 14" fill="none" stroke="#7CC4F5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 14 L22 24 L27 11" fill="none" stroke="#F5A524" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="3.5 3"/></svg>Walk We</span><span class="lang">文A</span><span class="sos">SOS</span></div>
<div class="ticket">
<p class="kick">ตัวอย่างเส้นทาง · 14:00 วันนี้</p>
<p class="route">MBK <span>→</span> สยาม</p>
<svg class="strip" viewBox="0 0 306 90"><path d="M18 60 C70 60 80 26 140 26" stroke="#1E4FA8" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M140 26 C200 26 220 60 288 60" stroke="#1E4FA8" stroke-width="7" fill="none"/><path d="M200 40 L232 52" stroke="#F5A524" stroke-width="7" stroke-dasharray="9 7"/><circle cx="18" cy="60" r="8" fill="#1E4FA8"/><circle cx="288" cy="60" r="8" fill="#0B1F3A"/></svg>
<div class="stats"><div><b>86%</b><small>ร่ม</small></div><div><b>9</b><small>นาที</small></div><div><b>+29</b><small>เมตร</small></div></div>
<p class="vs">ทางสั้นสุดร่มแค่ 55% — เดินเพิ่ม 29 ม. ได้ร่มเพิ่ม 31%</p>
<div class="perf"></div>
<div class="stub"><h1>เดินร่มกว่า กลับบ้านปลอดภัยกว่า</h1></div>
</div>
<div class="cta">เริ่มเลย</div><p class="foot">ไม่ต้องสมัคร · ทดลองที่ สยาม – ราชประสงค์</p>
</body></html>
